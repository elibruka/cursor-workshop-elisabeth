name: Exception Triage
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read
  issues: write

jobs:
  top-errors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Ensure Log Analytics extension
        run: az extension add --name log-analytics --upgrade

      - name: Query top 3 exceptions (last 24h)
        env:
          LOG_ANALYTICS_WORKSPACE_ID: ${{ vars.LOG_ANALYTICS_WORKSPACE_ID }}
        run: |
          set -euo pipefail

          KUSTO_QUERY=$(cat <<'KQL'
          exceptions
          | where timestamp > ago(24h)
          | summarize
              Occurrences = count(),
              LastSeen = max(timestamp),
              SampleMessage = any(tostring(outerMessage))
            by ProblemId = tostring(problemId), ExceptionType = tostring(type), Signature = substring(tostring(outerMessage), 0, 180)
          | extend Signature = iff(isempty(Signature), ExceptionType, Signature)
          | where not(isempty(Signature))
          | extend SeverityRank = 2
          | sort by SeverityRank desc, Occurrences desc, LastSeen desc
          | take 3
          | project SeverityRank, Occurrences, LastSeen, Signature, SampleMessage, SourceTables = dynamic(["exceptions"]), ProblemId, ExceptionType
          KQL
          )

          az monitor log-analytics query \
            --workspace "$LOG_ANALYTICS_WORKSPACE_ID" \
            --analytics-query "$KUSTO_QUERY" \
            --output json > top_errors.json

          if [ ! -s top_errors.json ]; then
            echo "No matching errors found in the last 24 hours."
          fi

      - name: Create tasks for top 3 findings with Claude
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          LOG_ANALYTICS_WORKSPACE_ID: ${{ vars.LOG_ANALYTICS_WORKSPACE_ID }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_FOUNDRY_API_KEY }}
          claude_args: |
            --model claude-sonnet-4-6
            --dangerously-skip-permissions
          prompt: |
            Read ./top_errors.json and create up to 3 separate GitHub issues in this repository, one issue per top finding.

            Requirements:
            - If top_errors.json is missing, empty, or has zero rows: do not create issues and return a short explanation.
            - Support Azure CLI response formats where rows may be under:
              - .tables[0].rows
              - .Tables[0].Rows
              - .[0].rows
              - .[0].Rows
            - Row mapping is:
              [0]=SeverityRank, [1]=Occurrences, [2]=LastSeen, [3]=Signature, [4]=SampleMessage, [5]=SourceTables, [6]=ProblemId, [7]=ExceptionType
            - Create at most 3 issues.
            - Use title format:
              [Auto][Log Analytics] Critical finding #<n> - <Signature>
            - Use body format:
              Automated task created from Azure Log Analytics (last 24h).

              - Severity: Critical
              - Occurrences: <Occurrences>
              - Last seen (UTC): <LastSeen>
              - Workspace ID: ${LOG_ANALYTICS_WORKSPACE_ID}
              - Problem ID: <ProblemId>
              - Exception type: <ExceptionType>
              - Source tables: <SourceTables>

              Sample message:
              <SampleMessage>

            Use GitHub CLI (`gh issue create`) and print the created issue URLs at the end.