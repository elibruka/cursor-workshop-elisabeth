name: Exception Triage
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read
  issues: write

jobs:
  top-errors:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: >-
            {"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}

      - name: Ensure Log Analytics extension
        run: az extension add --name log-analytics --upgrade

      - name: Query top 3 critical errors (last 24h)
        env:
          LOG_ANALYTICS_WORKSPACE_ID: ${{ vars.LOG_ANALYTICS_WORKSPACE_ID }}
        run: |
          set -euo pipefail

          KUSTO_QUERY=$(cat <<'KQL'
          union isfuzzy=true withsource=TableName AppExceptions, exceptions
          | extend EventTime = todatetime(coalesce(
              column_ifexists("timestamp", datetime(null)),
              column_ifexists("TimeGenerated", datetime(null))
            ))
          | where isnotnull(EventTime)
          | where EventTime > ago(24h)
          | extend ProblemId = tostring(coalesce(
                     column_ifexists("problemId", ""),
                     column_ifexists("ProblemId", "")
                   )),
                   ExceptionType = tostring(coalesce(
                     column_ifexists("type", ""),
                     column_ifexists("Type", ""),
                     column_ifexists("ExceptionType", "")
                   )),
                   OuterMessage = trim(@" \t\r\n", tostring(coalesce(
                     column_ifexists("outerMessage", ""),
                     column_ifexists("OuterMessage", ""),
                     column_ifexists("innermostMessage", ""),
                     column_ifexists("InnermostMessage", ""),
                     column_ifexists("message", ""),
                     column_ifexists("Message", "")
                   ))),
                   Signature = substring(iff(isempty(OuterMessage), ExceptionType, OuterMessage), 0, 180)
          | where not(isempty(Signature))
          | summarize
              Occurrences = count(),
              LastSeen = max(EventTime),
              SampleMessage = any(OuterMessage),
              SourceTables = make_set(TableName, 3)
            by ProblemId, ExceptionType, Signature
          | extend SeverityRank = 2
          | sort by SeverityRank desc, Occurrences desc, LastSeen desc
          | take 3
          | project SeverityRank, Occurrences, LastSeen, Signature, SampleMessage, SourceTables
          KQL
          )

          az monitor log-analytics query \
            --workspace "$LOG_ANALYTICS_WORKSPACE_ID" \
            --analytics-query "$KUSTO_QUERY" \
            --output json > top_errors.json

          if [ ! -s top_errors.json ]; then
            echo "No matching errors found in the last 24 hours."
          fi

      - name: Create tasks for top 3 findings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOG_ANALYTICS_WORKSPACE_ID: ${{ vars.LOG_ANALYTICS_WORKSPACE_ID }}
        run: |
          set -euo pipefail

          if [ ! -s top_errors.json ]; then
            echo "No tasks created because no matching errors were found."
            exit 0
          fi

          row_count=$(jq -r '
            def rows:
              if type == "object" then
                (.tables[0].rows // .Tables[0].Rows // [])
              elif type == "array" then
                (.[0].rows // .[0].Rows // [])
              else
                []
              end;
            rows | length
          ' top_errors.json)
          if [ "$row_count" -eq 0 ]; then
            echo "No tasks created because no matching errors were found."
            exit 0
          fi

          idx=0
          jq -c '
            def rows:
              if type == "object" then
                (.tables[0].rows // .Tables[0].Rows // [])
              elif type == "array" then
                (.[0].rows // .[0].Rows // [])
              else
                []
              end;
            rows[]
            | {
                severity: .[0],
                occurrences: .[1],
                last_seen: .[2],
                signature: .[3],
                sample_message: .[4],
                source_tables: .[5]
              }
          ' top_errors.json | while IFS= read -r row; do
            signature=$(jq -r '.signature // ""' <<<"$row")
            [ -n "$signature" ] || continue
            idx=$((idx + 1))

            severity=$(jq -r '.severity // 1' <<<"$row")
            occurrences=$(jq -r '.occurrences // 0' <<<"$row")
            last_seen=$(jq -r '.last_seen // ""' <<<"$row")
            sample_message=$(jq -r '.sample_message // ""' <<<"$row")
            source_tables=$(jq -c '.source_tables // []' <<<"$row")

            if [ "$severity" = "2" ]; then
              severity_text="Critical"
            else
              severity_text="Error"
            fi

            title="[Auto][Log Analytics] ${severity_text} finding #${idx} - ${signature}"

            body=$(cat <<EOF
          Automated task created from Azure Log Analytics (last 24h).

          - Severity: ${severity_text}
          - Occurrences: ${occurrences}
          - Last seen (UTC): ${last_seen}
          - Workspace ID: ${LOG_ANALYTICS_WORKSPACE_ID}
          - Source tables: ${source_tables}

          Sample message:
          ${sample_message}
          EOF
            )

            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "$body"

          done